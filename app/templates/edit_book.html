{% extends "base.html" %}

{% block content %}
<section class="form-card">
    <h1>Edit Book</h1>

    <form method="POST">
        <div class="form-group">
            <label>Book Title</label>
            <input type="text" name="title" value="{{ book.title }}">
        </div>

        <div class="form-group">
            <label>Author</label>
            <input type="text" name="author" value="{{ book.author }}">
        </div>

        <div class="form-group">
            <label>Publication Year</label>
            <input type="number" name="publication_year" value="{{ book.publication_year }}">
        </div>

        <div class="form-group">
            <label>Language</label>
            <input type="text" name="language" value="{{ book.language }}">
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text" name="category" value="{{ book.category }}">
        </div>

        <button type="submit" class="btn-primary">Update Book</button>
    </form>
</section>
{% endblock %}
