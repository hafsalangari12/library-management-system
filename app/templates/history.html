{% extends "base.html" %}

{% block content %}
<h1>Borrowing History</h1>

<table>
    <tr>
        <th>Book</th>
        <th>User</th>
        <th>Action</th>
        <th>Time</th>
    </tr>

    {% for r in records %}
    <tr>
        <td>{{ r.book.title }}</td>
        <td>{{ r.user.name if r.user else "System" }}</td>
        <td>{{ r.action }}</td>
        <td>{{ r.timestamp }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
