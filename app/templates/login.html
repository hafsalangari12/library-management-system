{% extends "base.html" %}

{% block content %}
<section class="form-card">
    <h1>Login</h1>

    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password">
        </div>

        <button class="btn-primary">Login</button>
    </form>
</section>
{% endblock %}
